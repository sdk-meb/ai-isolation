# ~/.config/ai-sandbox/tools.conf — YOUR sandboxed AI tools, and what they see.
# Created from the defaults on first use; private to you (chmod 600) and
# never visible inside the sandbox.
# Change it with:              ai-sandbox-admin add | remove
# or edit by hand, then run:   ai-sandbox-admin sync
#
# [name]             profile name (the wrapper runs: ai-sandbox run <name>)
# wrapped = PATH     the ORIGINAL program path; it becomes a small wrapper, so
#                    everything that starts it (shell, menu, IDE) is sandboxed
# exec-newest = GLOB run the newest version matching GLOB instead (for tools whose
#                    updater only adds versions to a folder, like Claude Code)
# exec = PATH        where the real program is moved to, next to the original
#                    (e.g. ~/.local/bin/.ai-real-x). ~ = home of whoever runs it.
#                    `ai-sandbox-admin sync` does the move (asks first; uses
#                    sudo for folders you can't write, like /usr/share/...)
# type = cli|gui     gui also gets: Wayland display, GPU, shared runtime dir
# project = cwd|DIR  its read-write work area (cwd = folder you start it in)
# rw = DIR           read-write folder, created if missing     (repeatable)
# rw-file = FILE     read-write single file, created if missing (repeatable)
# ro = DIR           read-only folder                          (repeatable)
# args = ...         extra arguments always given to the program (not when an
#                    Electron app runs it as Node, e.g. its CLI: cursor .)
# env-set = K=V      set a variable inside                     (repeatable)
# env-pass = A B     copy these variables in from your environment
# exec-allow = GLOB  extra aisup allow rule (e.g. the app's own helpers)
# aisup = yes|no     ask before it runs unknown programs (seccomp supervisor)
#
# Everything else in your home (~/.ssh, ~/.gnupg, browsers...) stays invisible.
# '#' starts a comment anywhere on a line.

[claude]
wrapped = ~/.local/bin/claude
exec = ~/.local/bin/.ai-real-claude
exec-newest = ~/.local/share/claude/versions/*   # its updater leaves the wrapper alone
type = cli
project = cwd
rw = ~/.claude
rw-file = ~/.claude.json
ro = ~/.local/share/claude            # binaries read-only; update unsandboxed: ~/.local/bin/.ai-real-claude update
env-set = DISABLE_AUTOUPDATER=1
env-pass = ANTHROPIC_API_KEY
aisup = no

[copilot]
wrapped = ~/.local/bin/copilot
exec = ~/.local/bin/.ai-real-copilot
type = cli
project = cwd
rw = ~/.copilot
env-pass = GH_TOKEN GITHUB_TOKEN COPILOT_GITHUB_TOKEN
aisup = no

[cursor]
wrapped = /usr/share/cursor/cursor            # root-owned: sync uses sudo; menu launchers need no change
exec = /usr/share/cursor/.ai-real-cursor
type = gui
project = ~/Workspace
rw = ~/.config/Cursor
rw = ~/.cursor
args = --ozone-platform=wayland --password-store=basic
exec-allow = /usr/share/cursor/*
aisup = no
