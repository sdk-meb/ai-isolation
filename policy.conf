# ~/.config/ai-sandbox/policy.conf — exec rules for aisup (tools with
# aisup = yes, or any run with AISUP=1). Yours, private, invisible inside.
#
#   <allow|deny|ask> <glob>
#   default <allow|deny|ask>
#
# Each exec is turned into one string:  "/absolute/path arg1 arg2 ..."
# (paths as seen INSIDE the sandbox) and matched against the globs top to
# bottom. FIRST MATCH WINS. In globs '*' also matches '/'.
#
# allow = run silently   deny = fail with EPERM   ask = desktop dialog
# Every decision is logged to ~/.local/state/aisup.log
#
# Remember: 'sh -c "curl ..."' is still caught, because sh has to exec curl.
# But 'python3 -c "import urllib..."' is only ONE exec (python3). Exec rules
# are a guard rail; the filesystem walls come from bubblewrap.

# ---------------------------------------------------------------- startup
# ai-sandbox adds these automatically ABOVE this file for each run:
#   allow <bwrap> *          allow <the tool's exec>*      + its exec-allow lines
# so tools added with `ai-sandbox-admin add` need nothing here.
#
# Electron/Chromium re-executes itself for its helper processes
ask /proc/self/exe*

# ---------------------------------------------------------------- never
deny */bin/sudo*
deny */bin/su *
deny */bin/pkexec*

# ---------------------------------------------------------------- ask first
# network tools
ask */bin/curl*
ask */bin/wget*
ask */bin/ssh*
ask */bin/scp*
ask */bin/sftp*
ask */bin/rsync*
ask */bin/nc *
ask */bin/ncat*
# destructive / publishing
ask */bin/rm *-*r*
ask */bin/git push*
ask */bin/npm publish*
# inline interpreter code (often used to dodge the rules above)
ask */bin/python3* -c *
ask */bin/perl* -e *

# ---------------------------------------------------------------- normal tools
ask /usr/bin/*
ask /usr/sbin/*
ask /usr/lib/*
ask /usr/libexec/*
ask /usr/local/bin/*
ask /bin/*
ask /sbin/*

# Uncomment if you work with npm projects and are tired of prompts:
# allow */node_modules/.bin/*

# ---------------------------------------------------------------- everything else
# (binaries inside the project, in /tmp, freshly downloaded, ...)
default ask
